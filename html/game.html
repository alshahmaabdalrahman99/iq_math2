<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IQ Puzzel - Spel</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <img src="../img/trophy.svg" alt="Trofee" />
</head>
<body class="page game-page">
  <main class="phone">
    <section class="screen-pad">
      <div class="status-row">
        <div class="status-item">
          <span>⭐ Punten</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="status-item">
          <span>⏱ Tijd</span>
          <strong id="timer-value">90</strong>
        </div>
        <div class="status-item">
          <span>🎯 Pogingen</span>
          <strong id="attempts-value">1 / 1</strong>
        </div>
      </div>

      <div class="level-line" id="level-line">Niveau: Makkelijk – Vraag 1 / 5</div>

      <section class="question-box">
        <p id="question-text">Hier komt de vraag</p>
      </section>

      <section class="answer-list" aria-label="Antwoordopties">
        <button class="answer answer-btn" id="answer-btn-0" type="button">
          <span class="letter">A.</span><span class="value">Antwoord 1</span>
        </button>

        <button class="answer answer-btn" id="answer-btn-1" type="button">
          <span class="letter">B.</span><span class="value">Antwoord 2</span>
        </button>

        <button class="answer answer-btn" id="answer-btn-2" type="button">
          <span class="letter">C.</span><span class="value">Antwoord 3</span>
        </button>

        <button class="answer answer-btn" id="answer-btn-3" type="button">
          <span class="letter">D.</span><span class="value">Antwoord 4</span>
        </button>
      </section>

      <div class="action-row">
        <button class="btn blue" id="submit-btn" type="button">Controleer</button>
        <button class="btn purple" id="hint-btn" type="button">Hint</button>
        <button class="btn red" id="quit-btn" type="button">Stop</button>
      </div>

      <p class="note" id="feedback-text"></p>
    </section>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
