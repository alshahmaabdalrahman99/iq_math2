<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IQ Puzzel - Spel</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <img src="../img/trophy.svg" alt="Trofee" />
</head>
<body class="page game-page">
  <main class="phone">
    <section class="screen-pad">
      <div class="status-row">
        <div class="status-item">
          <span>⭐ Punten</span>
          <strong>150</strong>
        </div>
        <div class="status-item">
          <span>⏱ Tijd</span>
          <strong>01:12</strong>
        </div>
        <div class="status-item">
          <span>🎯 Pogingen</span>
          <strong>2 / 3</strong>
        </div>
      </div>

      <div class="level-line">Niveau: Gemiddeld – Vraag 4 / 10</div>

      <section class="question-box">
        <p>Als 3 x 4 = 18, en 5 x 2 = 17,<br>Hoeveel is 6 x 3?</p>
      </section>

      <section class="answer-list" aria-label="Antwoordopties">
        <button class="answer" type="button"><span class="letter">A.</span><span class="value">16</span></button>
        <button class="answer" type="button"><span class="letter">B.</span><span class="value">18</span></button>
        <button class="answer" type="button"><span class="letter">C.</span><span class="value">20</span></button>
        <button class="answer" type="button"><span class="letter">D.</span><span class="value">22</span></button>
      </section>

      <div class="action-row">
        <a class="btn blue" href="results.html">Controleer</a>
        <button class="btn purple" type="button">Hint</button>
        <a class="btn red" href="index.html">Stop</a>
      </div>

      <p class="note">
        Dit is de HTML/CSS-voorkant in dezelfde stijl als de mockup.
        Voor klikgedrag, scores, timer en echte vraagdata voeg je zelf JavaScript toe.
      </p>
    </section>
  </main>
  <script src="../js/script.js"></script>
</body>
</html>
