<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IQ Puzzel - Kies niveau</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <img src="../img/trophy.svg" alt="Trofee" />
</head>
<body class="page game-page">
  <main class="phone">
    <section class="screen-pad">
      <h1 class="section-title">Kies Niveau</h1>

      <div class="level-grid">
        <article class="level-card">
          <h3>Makkelijk</h3>
          <p>Rustige start met eenvoudige getallen en duidelijke patronen.</p>
          <button class="btn green level-btn" id="easy-btn" type="button">Speel Makkelijk</button>
        </article>

        <article class="level-card">
          <h3>Gemiddeld</h3>
          <p>Goede mix van snelheid, logisch denken en rekeninzicht.</p>
          <button class="btn blue level-btn" id="medium-btn" type="button">Speel Gemiddeld</button>
        </article>

        <article class="level-card">
          <h3>Moeilijk</h3>
          <p>Sneller tempo, lastigere patronen en meer druk per vraag.</p>
          <button class="btn red level-btn" id="hard-btn" type="button">Speel Moeilijk</button>
        </article>
      </div>

      <div class="menu mt-20">
        <a class="btn purple" href="index.html">Terug</a>
      </div>
    </section>
  </main>
  <script src="../js/script.js"></script>
</body>
</html>
